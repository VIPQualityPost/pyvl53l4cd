[project]
name = "pyvl53l4cd"
version = "0.1.0"
description = "Python VL53L4CD driver"
readme = "README.md"
requires-python = ">=3.13"

[project.optional-dependencies]
ftdi = [
    "pyftdi>=0.57.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyvl53l4cd"]
